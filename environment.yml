name: psmaf-univ
# Reproducible original UNIV / Stage 2 diagnostic environment. Python is
# intentionally constrained because NumPy 1.23.5 does not support Python 3.12+.
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.0
  - torchvision>=0.15
  - numpy=1.23.5
  - pyyaml>=6.0
  - pip
  - pip:
      - timm>=0.9
      - peft>=0.10
      - pytest>=7.0
